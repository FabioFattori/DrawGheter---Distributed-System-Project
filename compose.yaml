services:
  drawgheterinfrastructure:
    image: drawgheterinfrastructure
    build:
      context: .
      dockerfile: DrawGheterInfrastructure/Dockerfile
    ports:
      - "5001:8080"   # se la tua app ascolta su 8080, esportata su 5001
    environment:
      # POSTGRES
      ConnectionStrings__Postgres: "Host=postgres;Database=game;Username=gameuser;Password=gamepass"

      # REDIS
      Redis__Connection: "redis:6379"

      # MINIO / S3
      S3__Endpoint: "http://minio:9000"
      S3__Bucket: "snapshots"
      S3__AccessKey: "minioadmin"
      S3__SecretKey: "minioadmin"

      ASPNETCORE_ENVIRONMENT: "Development"

    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: gamepass
      POSTGRES_DB: game
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
